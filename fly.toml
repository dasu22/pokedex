app = "dasu22-pokedex"
primary_region = "iad"

[build]

[env]
  DATA_FILE = "/data/pokemon_data.json"

# Persistent volume — pokemon_data.json lives here across deploys/restarts
[mounts]
  source = "pokedex_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
