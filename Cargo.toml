[package]
name = "pokedex"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json", "form"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
time = "0.3"

[profile.release]
opt-level = 3
